name: javerage_todos
description: An example todos app that showcases bloc state management patterns.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Packages
  # Packages
  bloc: ^9.0.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_serializable: ^6.11.1
  meta: ^1.16.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.2

  # local packages
  local_storage_todos_api:
    path: packages/local_storage_todos_api
  todos_api:
    path: packages/todos_api
  todos_repository:
    path: packages/todos_repository

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icono.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icono.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icono.png
  android: true
  ios: true
  web: false
